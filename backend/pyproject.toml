[project]
name = "umbra"
version = "1.0.0"
description = "Umbra — self-hosted private media manager (local desktop app)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "requests>=2.31",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",   # 42+ needed for Argon2id; older builds fall back to PBKDF2
    "keyring>=24",          # optional at runtime (settings fallback), used when present
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]   # native window; `python main.py --browser` works without it
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# correctness + unused names; the compact one-liner style (E701/E702), grouped
# imports (E401) and intentional lazy imports (E402) are deliberate — not churned
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E701", "E702", "E401", "E402"]
