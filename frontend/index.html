<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
/* Paint the stored theme + custom background BEFORE the first frame: the app
   chain applies the saved look much later (state.js), so without this every
   start flashes the stylesheet's default dark ink before switching to the
   user's background - on the splash, and behind the lock screen. Mirrors
   applyAdvanced()'s background math exactly, so __paintLook can also be fed
   the server-side settings once they arrive. */
(function(){
 const r=document.documentElement;
 const mix=(h,f)=>{const n=parseInt(h.slice(1),16);let R=(n>>16&255),G=(n>>8&255),B=(n&255);
  if(f<0){R*=(1+f);G*=(1+f);B*=(1+f)}else{R+=(255-R)*f;G+=(255-G)*f;B+=(255-B)*f}
  return '#'+[R,G,B].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')};
 function paint(s){
  if(!s)return;
  if(s.theme)r.dataset.theme=s.theme;
  const a=s.adv||{};
  if(a.accent)r.style.setProperty('--accent',a.accent);
  if(a.background){
   r.style.setProperty('--bg',a.background);
   r.style.setProperty('--bg2',mix(a.background,-0.06));
   r.style.setProperty('--surface',mix(a.background,0.04));
   r.style.setProperty('--surface2',mix(a.background,0.07));
  }
 }
 try{paint(JSON.parse(localStorage.getItem('obscura:v1')||'null'))}catch(e){}
 window.__paintLook=paint;
})();
</script>
<script>
(function(){
 function show(msg){
  if(!document.body)return;
  var t=document.getElementById('toast-root');
  if(!t){t=document.createElement('div');t.id='toast-root';document.body.appendChild(t)}
  var d=document.createElement('div');
  d.className='toast';d.style.borderColor='#d3705f';
  d.textContent=msg;
  t.appendChild(d);
 }
 window.addEventListener('error',function(e){
  var t=e.target;
  if(t&&t!==window&&t.tagName)return;
  show('Script Error: '+(e.message||'Unknown')+' - Open Console (F12) For The Exact Line');
 },true);
 window.addEventListener('unhandledrejection',function(e){
  show('Promise Error: '+(e.reason&&e.reason.message?e.reason.message:'Unknown')+' - Open Console (F12)');
 });
 var PH='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="90"><rect width="60" height="90" fill="#211d15"/><rect x="1" y="1" width="58" height="88" fill="none" stroke="#3d3524"/></svg>');
 document.addEventListener('error',function(e){
  var t=e.target;
  if(t&&t.tagName==='IMG'&&!t.dataset.fbk){
   var s=t.getAttribute('src')||'';
   if(s.indexOf('enc://')===0)return;
   t.dataset.fbk='1';t.src=PH;
  }
 },true);
 // --- API token: auto-attach to every same-origin /api/ request ---
 // The token is injected as a cookie on the page load (never in the URL).
 // Legacy ?t= links are still accepted and scrubbed from the URL immediately.
 (function(){
  var TK=null;
  try{
   TK=sessionStorage.getItem('umbra:token')||'';
    if(!TK){
     var m=document.cookie.match(/(?:^|;\s*)umbra_token=([^;]*)/);
    TK=m?decodeURIComponent(m[1]):'';
   }
   if(!TK){
    TK=new URLSearchParams(location.search).get('t')||'';
    if(TK){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
   }
  }catch(e){}
  if(TK){try{sessionStorage.setItem('umbra:token',TK)}catch(e){}}
  window.__UMBRA_TOKEN=TK;
  // native-window JS bridge (belt-and-braces next to the cookie)
  try{
   if(window.pywebview&&window.pywebview.api&&window.pywebview.api.get_token){
    window.pywebview.api.get_token().then(function(v){
     if(v){window.__UMBRA_TOKEN=v;try{sessionStorage.setItem('umbra:token',v)}catch(e){}}
    });
   }
  }catch(e){}
  if(!window.fetch)return;
  var _f=window.fetch.bind(window);
  window.fetch=function(input,init){
   try{
    var u=(typeof input==='string')?input:((input&&input.url)||'');
    var abs=(u.indexOf('http')===0)?u:(location.origin+u);
    if(abs.indexOf(location.origin+'/api/')===0){
     var tok=window.__UMBRA_TOKEN||TK;
     if(tok){
      init=init?Object.assign({},init):{};
      var h=new Headers(init.headers||{});
      h.set('X-Umbra-Token',tok);
      init.headers=h;
     }
     return _f(u,init);
    }
    }catch(e){}
    return _f(input,init);
   };
   // The lock screen paints before the app loads: put the server's real look
   // on the root as early as possible (hash-free settings GET; also rides
   // through the app lock). Falls back to the stored look already painted.
   if(window.__paintLook&&(window.__UMBRA_TOKEN||TK)){
    _f('/api/settings').then(function(r){return r.ok?r.json():null})
     .then(function(s){if(s)window.__paintLook(s)}).catch(function(){});
   }
  })();
 window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
   if(document.body&&!document.body.dataset.booted)show('App Did Not Finish Loading - The Script Block Is Incomplete. Make Sure The File Ends With </html> And Re-Copy The Whole Code.');
  },1500);
 });
})();
</script>

/* --dt-gap is the page's one vertical step (declared on .page so [data-dtoolbar]
   and the section labels that follow it can inherit it). It drives:
   · the studio/category catalogue stack (detail.js [data-dtoolbar]) —
     toolbar → filter panel → section label → its [data-dsec] block → next label;
   · the toolbar's top step on the studio/category detail page — the info
     block above it ends with varying trailing margins (chips row 14px,
     description 4px, "Show More" 14px), so those are zeroed and the gap above
     the catalogue is exactly --dt-gap like every other step (it used to add up
     to 26px: chips row 14px + toolbar padding-top 12px);
   · the toolbar's bottom gap everywhere (a real margin now, so the gap below
     the toolbar measures the same as any other block gap — the old
     padding-bottom left the .toolbar box flush against #list-main);
   · the Continue Watching block (#cw-section, lists.js continueHTML) on the
     movies/scenes tabs — its cards sit --dt-gap above the toolbar's controls,
     exactly like the toolbar's controls sit above #list-main (the toolbar's
     12px top padding is dropped right after #cw-section so the step stays one
     value). Tuning --dt-gap can never leak unevenness into other tabs.
   The section labels also drop their line-box leading (10px mono in a 15px
   flex line) so text edges line up with the measured gaps too. */
#cw-section{margin-bottom:var(--dt-gap)}
/* The label's spacing is owned here — !important because older builds of
   js/lists.js (continueHTML) emit the label with inline style="margin:0 0 6px",
